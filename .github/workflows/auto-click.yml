name: VISTA Daily Punch Out

on:
  workflow_dispatch: {}
  schedule:
    # Mon-Fri at 6:30 PM IST (13:00 UTC)
    - cron: "0 13 * * 1-5"

env:
  TZ: "Asia/Kolkata"

jobs:
  punch-out:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Show run time in IST
        run: |
          echo "UTC : $(date -u)"
          echo "IST : $(TZ='Asia/Kolkata' date)"

      - name: Run VISTA Punch Out
        env:
          LOGIN_URL: "https://online.apac.adp.com/signin/v1/?APPID=ADPVISTA-IN&productId=ff803a24-0ee0-47fc-e053-f282530bfabe&returnURL=https://www.vista.adp.com/in/&callingAppId=ADPVISTA&TARGET=-SM-https://www.vista.adp.com/in/"
          USERNAME: ${{ secrets.LOGIN_USERNAME }}
          PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: node main.js
